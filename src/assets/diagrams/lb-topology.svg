<svg viewBox="0 0 860 200" xmlns="http://www.w3.org/2000/svg">
      <!-- Browser -->
      <rect x="40" y="70" width="150" height="55" rx="4" fill="var(--bg-node)" stroke="var(--border)" stroke-width="1"/>
      <text x="60" y="95" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--text-heading)" font-weight="600">Browser / client</text>
      <text x="60" y="112" font-family="JetBrains Mono, monospace" font-size="9" fill="var(--text-muted)">on your LAN</text>

      <!-- ARP -->
      <rect x="240" y="30" width="170" height="30" rx="4" fill="var(--accent-lb-dim)" stroke="var(--accent-lb)" stroke-width="1"/>
      <text x="256" y="50" font-family="JetBrains Mono, monospace" font-size="9" fill="var(--accent-lb)" font-weight="500">ARP: who has .60?</text>
      <line x1="190" y1="82" x2="236" y2="50" stroke="var(--accent-lb)" stroke-width="1.5" marker-end="url(#arr-lb)"/>

      <!-- Cilium L2 responder -->
      <rect x="460" y="20" width="220" height="55" rx="4" fill="var(--accent-cilium-dim)" stroke="var(--accent-cilium)" stroke-width="1.5"/>
      <text x="480" y="42" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--accent-cilium)" font-weight="600">Cilium L2 Announcer</text>
      <text x="480" y="60" font-family="JetBrains Mono, monospace" font-size="9" fill="var(--text-muted)">responds with worker MAC</text>
      <line x1="410" y1="45" x2="456" y2="45" stroke="var(--accent-lb)" stroke-width="1.5" marker-end="url(#arr-lb)"/>

      <!-- Traffic flow -->
      <line x1="190" y1="100" x2="456" y2="120" stroke="var(--accent-lb)" stroke-width="1.5" marker-end="url(#arr-lb)"/>
      <text x="275" y="118" font-family="JetBrains Mono, monospace" font-size="8" fill="var(--accent-lb)">TCP to 192.168.20.60:80</text>

      <!-- Service -->
      <rect x="460" y="95" width="220" height="45" rx="4" fill="var(--bg-elevated)" stroke="var(--accent-svc)" stroke-width="1.5" stroke-dasharray="4,2"/>
      <text x="480" y="115" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--accent-svc)" font-weight="500">Service type: LoadBalancer</text>
      <text x="480" y="132" font-family="JetBrains Mono, monospace" font-size="9" fill="var(--text-muted)">externalIP: 192.168.20.60</text>

      <!-- Pod -->
      <rect x="720" y="95" width="120" height="45" rx="4" fill="var(--bg-pod)" stroke="var(--accent-node)" stroke-width="1.5"/>
      <text x="736" y="115" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--accent-node)" font-weight="600">ArgoCD</text>
      <text x="736" y="132" font-family="JetBrains Mono, monospace" font-size="9" fill="var(--text-muted)">10.244.x.y</text>
      <line x1="680" y1="118" x2="716" y2="118" stroke="var(--accent-cilium)" stroke-width="1.5" marker-end="url(#arr-cil)"/>

      <!-- Pool label -->
      <rect x="460" y="160" width="220" height="28" rx="4" fill="var(--bg-node)" stroke="var(--border)" stroke-width="1"/>
      <text x="480" y="179" font-family="JetBrains Mono, monospace" font-size="8.5" fill="var(--text-muted)">Pool: .60–.80 (CiliumLBIPPool)</text>
    </svg>
