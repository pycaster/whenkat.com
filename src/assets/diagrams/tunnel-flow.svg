<svg viewBox="0 0 680 260" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Traffic flow diagram">
      <defs>
        <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#5b8def"/>
        </marker>
        <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#3fb950"/>
        </marker>
      </defs>

      <!-- Browser -->
      <rect x="10" y="90" width="110" height="56" rx="7" fill="#141722" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="65" y="114" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#e2e6f0" font-weight="600">Browser</text>
      <text x="65" y="130" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#6b7394">whenkat.com</text>

      <!-- Arrow: Browser → Cloudflare -->
      <line x1="120" y1="118" x2="188" y2="118" stroke="#5b8def" stroke-width="1.5" marker-end="url(#arr)"/>
      <text x="154" y="109" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="8" fill="#5b8def">HTTPS</text>

      <!-- Cloudflare Edge -->
      <rect x="190" y="72" width="130" height="92" rx="7" fill="#141722" stroke="#5b8def" stroke-width="1.5"/>
      <text x="255" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#e2e6f0" font-weight="600">Cloudflare Edge</text>
      <text x="255" y="118" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#6b7394">DDoS protection</text>
      <text x="255" y="133" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#6b7394">TLS termination</text>
      <text x="255" y="148" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#6b7394">WAF</text>

      <!-- Arrow: Cloudflare ↔ cloudflared (tunnel) -->
      <line x1="320" y1="118" x2="388" y2="118" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-green)"/>
      <text x="354" y="108" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="8" fill="#3fb950">tunnel</text>
      <text x="354" y="133" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="8" fill="#3fb950">outbound only</text>

      <!-- k8s box -->
      <rect x="388" y="44" width="278" height="178" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="527" y="62" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#6b7394" letter-spacing="0.08em">KUBERNETES CLUSTER</text>

      <!-- cloudflared -->
      <rect x="400" y="90" width="110" height="56" rx="6" fill="#141722" stroke="rgba(63,185,80,0.4)" stroke-width="1.5"/>
      <text x="455" y="114" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" fill="#3fb950" font-weight="500">cloudflared</text>
      <text x="455" y="130" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="8" fill="#6b7394">×2 replicas</text>

      <!-- Arrow: cloudflared → NGF -->
      <line x1="510" y1="118" x2="542" y2="118" stroke="#5b8def" stroke-width="1.5" marker-end="url(#arr)"/>

      <!-- NGF -->
      <rect x="544" y="90" width="106" height="56" rx="6" fill="#141722" stroke="rgba(59,130,246,0.3)" stroke-width="1.5"/>
      <text x="597" y="112" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#e2e6f0" font-weight="600">NGF</text>
      <text x="597" y="127" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="8" fill="#6b7394">HTTPRoute</text>
      <text x="597" y="140" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="8" fill="#6b7394">→ blog svc</text>

      <!-- Home router label -->
      <rect x="10" y="200" width="310" height="22" rx="4" fill="rgba(63,185,80,0.06)" stroke="rgba(63,185,80,0.15)" stroke-width="1"/>
      <text x="165" y="215" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#3fb950">home router — no open ports required</text>
    </svg>
